[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeintel"
version = "0.1.0"
description = "Autonomous Software Engineering & Code Intelligence Platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "networkx>=3.2",
  "numpy>=1.26",
  "python-multipart>=0.0.9",
  "requests>=2.31",
]

[project.optional-dependencies]
agents = ["langgraph>=0.2"]
embeddings = ["sentence-transformers>=3.0", "faiss-cpu>=1.8"]
analysis = ["ruff>=0.4", "bandit>=1.7", "semgrep>=1.70", "coverage>=7.4"]
ui = ["streamlit>=1.34"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["E501", "E701", "E702", "B008", "B905"]